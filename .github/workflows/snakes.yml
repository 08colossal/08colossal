name: Generate Snakes

on:
  schedule: # Executa a cada 12 horas
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Jobs to update datas
    permissions: 
      contents: write # ⚠️ OBRIGATÓRIO: Permite que a Action grave arquivos no seu repositório
    runs-on: ubuntu-latest
    steps:
      # Gera a animação da cobrinha usando a versão moderna da ferramenta
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: 08colossal
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Envia os arquivos gerados direto para a branch output usando uma versão atualizada
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
